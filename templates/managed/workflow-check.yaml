# Managed by aem-kit. Same validation as the pre-commit, on the whole project,
# so `git commit --no-verify` cannot skip it.
name: aem-kit check
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
